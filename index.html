<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Personal Blog Platform</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

  <div class="container">
    <h1>Posts</h1>
    

    <!--New post Form -->
    <section id="post-form">
     <h2> New Post</h2>
     <form id="post-form" novalidate>
        <div>
          <label for="post-title">Title</label>
          <input type="text" id="post-title" name="title">
          <span id="title-error" class="error" aria-live="polite"></span>
        </div>

        <div>
          <label for="post-content">Content</label>
          <textarea id="post-content" name="content" rows="5"></textarea>
          <span id="content-error" class="error" aria-live="polite"></span>
        </div>

        <button type="submit" id="submit-btn">Submit</button>
     </form>
    </section>

    <!--Blog Post list that is dynamic -->
    <section id="post-list-section">
      <h2>All Posts</h2>
      <div id="post-list"></div>
    </section>
  </div>
        
</body>
